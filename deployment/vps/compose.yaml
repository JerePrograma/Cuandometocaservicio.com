name: calendario-servicios-demo
services:
  web:
    build:
      context: ../..
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
    image: scalaris/calendario-servicios-demo:local
    restart: unless-stopped
    ports: ['127.0.0.1:18094:8080']
    networks:
      proxy:
        aliases: [calendario-demo-web]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  proxy:
    external: true
